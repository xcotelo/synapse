version: '3.9'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: synapse-postgres
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: ${DB_USERNAME:-synapse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synapse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicación Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/synapse
      DB_USERNAME: ${DB_USERNAME:-synapse}
      DB_PASSWORD: ${DB_PASSWORD:-synapse}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY:-tu-clave-jwt-fuerte}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      API_KEY_LLAMA: ${API_KEY_LLAMA:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SPRING_PROFILES_ACTIVE: production
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./digital-brain-notes:/app/digital-brain-notes
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/synapse/api/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
